example_id: "golden_path_phase_11_production_readiness_gate"
phase_id: 11
phase_key: "production_readiness_gate"
phase_name: "Production Readiness Gate"
source_packet: "skills/agent-build-managed-agentops/assets/examples/golden-path-revenue-intake.yaml"
status: "implementation_grade_example"
purpose: "Demonstrate production readiness based on pilot evidence, owner signoff, incident rehearsal, revocation readiness, rollback, and first-month monitoring."

minimum_completed_sections:
  - "source_inputs"
  - "production_scope"
  - "pilot_evidence_summary"
  - "readiness_domains"
  - "production_controls"
  - "incident_rehearsal"
  - "residual_risk_acceptance"
  - "production_decision"
  - "signoff"

section1_inputs_used:
  - "managed_lifecycle_object"
  - "measurement_intelligence"
  - "risk_control_model"
  - "technical_blueprint"
section2_outputs_demonstrated:
  - "production_readiness_gate"

evidence_expectations:
  - "Cite managed lifecycle, measurement intelligence, risk model, technical blueprint, pilot evidence, evals, controls, observability, release candidate, and rollback package."
  - "Show pilot metric summary, readiness domains, first-month monitoring, residual-risk acceptance, incident rehearsal, revocation readiness, and owner signoffs."
  - "Record blockers for failed pilot thresholds, missing owners, missing traces, failed rehearsal, or wider production scope."
failure_modes_to_test:
  - "Production launch lacks pilot evidence, owner signoff, incident rehearsal, revocation readiness, or accepted residual risk."
return_to_method_triggers_to_test:
  - "Production readiness requires scope, owner, risk, or lifecycle changes."
  - "Production evidence invalidates value, adoption, source truth, oversight, or operational assumptions."

