build_scope:
  agent_name: "Revenue Intake Follow-up Agent"
  business_outcome: "Reduce stalled intake records caused by missing customer or opportunity information."
  target_user_groups:
    - "Revenue intake coordinators"
  excluded_user_groups:
    - "Sales representatives"
    - "Customer success managers"
  workflow_boundary: "Open revenue intake records where required intake fields are missing."
  primary_use_cases:
    - "Identify missing intake fields from approved read-only sources."
    - "Draft a follow-up request for coordinator approval."
  prohibited_use_cases:
    - "Send customer-facing messages."
    - "Modify opportunity stage, owner, forecast, or next step."
    - "Prioritize or disqualify opportunities."
  data_domains:
    - "customer_contact"
    - "opportunity_metadata"
    - "intake_form_fields"
  systems_in_scope:
    - "CRM read-only opportunity view"
    - "Intake form read-only response store"
  systems_out_of_scope:
    - "Email send service"
    - "CRM write API"
  tools_or_actions_in_scope:
    - "Read approved intake record."
    - "Read approved opportunity metadata."
    - "Draft internal follow-up text."
  tools_or_actions_prohibited:
    - "External send."
    - "CRM write."
    - "Opportunity routing."
  human_review_requirements:
    - "Coordinator approves every draft before any message is sent."
  minimum_safe_first_behavior: "Draft and flag missing-information follow-up requests for human approval."
  scope_lock:
    source_scope_statement: "Approved Step 17 first build scope: draft and flag only for missing intake fields."
    narrowest_allowed_scope: "Intake coordinator receives a draft follow-up for review; no external action."
    approved_behavior_level: "draft_and_flag"
    allowed_inputs:
      - "Missing-field list."
      - "Customer contact name."
      - "Opportunity metadata."
    allowed_outputs:
      - "Coordinator-facing draft follow-up."
      - "Missing-field explanation."
    allowed_actions:
      - "Read approved sources."
      - "Draft internal text."
      - "Flag for human review."
    prohibited_actions:
      - "Send message."
      - "Write CRM field."
      - "Infer missing customer data from unapproved sources."
    edge_cases_in_scope:
      - "Multiple missing fields in one record."
      - "Missing preferred contact name."
    edge_cases_out_of_scope:
      - "Customer disputes data accuracy."
      - "Opportunity ownership conflict."
    assumptions:
      - "Intake coordinators can review drafts within one business day."

gate_decisions:
  build_conversion_gate:
    phase_id: 1
    status: "passed"
    required_evidence:
      - "Approved Step 17 implementation_decision_packet."
      - "Approved Step 18 managed_lifecycle_object."
      - "Accepted method_to_build_handoff_contract."
      - "Separate implementation approval with budget/timebox and permitted environments."
      - "Owner model covering business, technical, security, data, AgentOps, support, and revocation."
    pass_criteria:
      - "Build authorization is explicit and current."
      - "Build scope is equal to or narrower than approved handoff."
      - "Every required owner is named."
      - "Every material claim cites evidence."
      - "Failure modes and return-to-method triggers are evaluated."
    fail_criteria:
      - "Missing Step 18 approval."
      - "Missing separate implementation approval."
      - "Unclear owner model."
      - "Ambiguous scope, budget, or timebox."
      - "Any proposed build behavior exceeds approved handoff."
    failure_handling:
      on_missing_approval: "Block build conversion and return to Revenue AI Build Forum."
      on_scope_ambiguity: "Hold phase and require product owner scope clarification."
      on_owner_gap: "Assign named owner or block phase exit."
      on_evidence_gap: "Record missing evidence in open_handoff_questions."
    owner_signoff_required:
      - "business_owner"
      - "technical_owner"
      - "security_owner"
      - "agentops_owner"
    return_to_method_review:
      evaluated: true
      triggered: false
      trigger_reason: ""
      returned_to: ""
      decision_date: "2026-05-04"

acceptance_contract:
  required_artifacts:
    - "agent_necessity_kill_test"
    - "agent_build_plan"
    - "agent_architecture_record"
    - "tool_contract_registry"
    - "eval_harness_spec"
