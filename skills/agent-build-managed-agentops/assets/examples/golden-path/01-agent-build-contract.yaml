    - "agent_build_contract.owners"
    - "agent_build_contract.build_scope"
    - "agent_build_contract.gate_decisions.build_conversion_gate"
  phase_3_exit_artifacts:
    - "agent_build_contract.first_behavior_scope"
    - "agent_build_plan"
  success_criteria:
    - "Draft acceptance rate is at least 90 percent in pilot."
    - "Material error rate is no more than 2 percent."
  non_functional_requirements:
    availability_target: "business_hours"
    latency_target: "under 20 seconds per draft"
    security_requirements:
      - "Read-only access until later change review."
    privacy_requirements:
      - "No customer-sensitive free text beyond approved intake fields."
    audit_requirements:
      - "Trace every run and source field used."
  launch_blockers:
    - "Any unapproved write or send path."
    - "Any untraced run."
    - "Missing coordinator approval workflow."

change_control:
  material_change_definition:
    - "Any write/send action."
    - "Any new source, tool, user group, or behavior level."
    - "Any reduction in human approval."
  change_review_required: true
  change_review_object_type: "change_expansion_retirement_review"

