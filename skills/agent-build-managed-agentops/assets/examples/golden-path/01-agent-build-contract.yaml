  authorized_scope_summary: "Build a draft-and-flag agent that drafts missing-intake follow-up requests for coordinator approval."
  authorized_environments:
    - "offline_validation"
    - "sandbox"
  explicit_out_of_scope:
    - "Autonomous external send."
    - "CRM field updates."
    - "Use by sales representatives or customer success managers."
    - "Use outside missing-field intake follow-up."
    - "Production operation before production_readiness_gate."
  approval_conditions:
    - "All drafts must be approved by an intake coordinator before delivery."
    - "Read-only source access only until a later change review."
  decision_state: "approved"
  decision_record:
    gate_owner: "Revenue Operations Build Lead"
    decision_forum: "Revenue AI Build Forum"
    decision_date: "2026-05-04"
    decision: "pass"
    decision_rationale: "Approved Step 17/18 handoff and separate implementation approval are complete; scope remains draft-and-flag."
    no_go_reasons: []
    conditions_before_next_phase:
      - "Agent necessity kill test must preserve no-send and no-write reductions."
  return_to_method_triggers:
    - "Behavior level changes beyond draft_and_flag."
    - "CRM write access becomes required."
    - "Pilot group expands beyond intake coordinators."
    - "Handoff version cannot be verified."

