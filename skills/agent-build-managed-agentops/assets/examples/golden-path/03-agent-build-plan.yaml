evidence_expectations:
  - "Cite approved implementation decision and lifecycle scope."
  - "Cite readiness minimum safe first behavior and prohibited behaviors."
  - "Cite workflow roles, steps, edge cases, and information objects."
  - "Cite organizational source ownership, access, sensitivity, retention, and permitted/prohibited AI action decisions."
failure_modes_to_test:
  - "First behavior is broader than approved handoff."
  - "Prohibited behaviors are not explicit."
  - "Human review path is undefined."
