rule_group: eval_and_guardrail_design
phase_id: 7
phase_key: eval_and_guardrail_design
status: active
minimum_required_checks: 8
required_section1_inputs:
  - "ai_guidance_pack"
  - "measurement_intelligence"
  - "risk_control_model"
  - "readiness_object"
  - "managed_lifecycle_object"
required_section2_outputs:
  - "eval_harness_spec"
  - "guardrail_control_matrix"
failure_modes:
  - "Eval suite does not cover guidance, edge cases, risks, prohibited behaviors, and permissions."
  - "Blocking thresholds are missing."
return_to_method_triggers:
  - "Required evals reveal missing knowledge or unstable truth production."
  - "Eval or guardrail design changes approved scope, behavior level, source truth, risk, value, or oversight assumptions."
checks:
  - check_id: "required_section1_inputs_present"
    severity: "error"
    description: "Required Section 1 source artifacts are referenced, approved, versioned, and cited."
  - check_id: "required_section2_outputs_present"
    severity: "error"
    description: "eval_harness_spec and guardrail_control_matrix are present or intentionally blocked with owner and reason."
  - check_id: "checklist_has_phase_specific_sections"
    severity: "error"
    description: "Checklist includes exact sections ## Phase-Specific Checks and ## Blocking Conditions."
  - check_id: "scope_not_widened_without_change_review"
    severity: "error"
    description: "No users, sources, tools, environments, actions, outputs, or behavior levels exceed the approved handoff."
  - check_id: "behavior_eval_sets_complete"
    severity: "error"
    description: "Eval plan includes golden, edge, adversarial, regression, source-truth, permission-boundary, and human-review coverage."
  - check_id: "adversarial_tests_present"
    severity: "error"
    description: "Prompt injection, instruction override, source manipulation, data exfiltration, unsupported write/send, and policy conflict tests are present."
  - check_id: "blocking_thresholds_and_sample_sizes_present"
    severity: "error"
    description: "Every eval suite has minimum sample size, pass threshold, blocking metrics, reviewer roles, and evidence requirements."
  - check_id: "dataset_provenance_redaction_present"
    severity: "error"
    description: "Every eval dataset has source, owner, redaction status, sensitive-field handling, allowed environments, and evidence references."
  - check_id: "risk_to_control_traceability_present"
    severity: "error"
    description: "Every material risk, prohibited behavior, permission boundary, and source-truth rule maps to one or more controls."
  - check_id: "control_fail_behavior_present"
    severity: "error"
    description: "Every control has owner, test method, evidence required, pass criteria, fail behavior, and status."
  - check_id: "promotion_and_rollback_criteria_present"
    severity: "error"
    description: "Offline-to-sandbox, sandbox-to-pilot, pilot-to-production, rollback, pause, and revocation criteria are explicit."
  - check_id: "rubric_has_minimum_criteria"
    severity: "error"
    description: "Rubric has at least 8 criteria, each with criterion_id, required, evidence_required, and pass_condition."
  - check_id: "return_to_method_triggers_present"
    severity: "warning"
    description: "Return-to-method triggers are listed and evaluated."
