  tools_or_actions_prohibited: []
  human_review_requirements: []
  minimum_safe_first_behavior: ""
  scope_lock:
    source_scope_statement: ""
    narrowest_allowed_scope: ""
    approved_behavior_level: ""
    allowed_inputs: []
    allowed_outputs: []
    allowed_actions: []
