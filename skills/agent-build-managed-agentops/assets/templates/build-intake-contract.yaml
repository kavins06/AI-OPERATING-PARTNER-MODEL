  phase_3_scope_decision:
    decision: "hold"
    pass_fail_basis: ""
    scope_reductions_required: []
    evidence_refs: []

gate_decisions:
  build_conversion_gate:
    phase_id: 1
    status: "not_started"
    required_evidence:
      - "Approved Step 17 implementation_decision_packet."
      - "Approved Step 18 managed_lifecycle_object."
      - "Accepted method_to_build_handoff_contract."
      - "Separate implementation approval with budget/timebox and permitted environments."
      - "Owner model covering business, technical, security, data, AgentOps, support, and revocation roles."
    pass_criteria:
      - "Build authorization is explicit and current."
      - "Build scope is equal to or narrower than approved handoff."
      - "Every required owner is named or the gap is a blocker."
      - "Every material claim cites evidence."
      - "Failure modes and return-to-method triggers are evaluated."
    fail_criteria:
      - "Missing Step 18 approval."
      - "Missing separate implementation approval."
      - "Unclear owner model."
      - "Ambiguous scope, budget, or timebox."
      - "Any proposed build behavior exceeds approved handoff."
    failure_handling:
      on_missing_approval: "Block build conversion and return to Section 1 method owner or authorizing body."
      on_scope_ambiguity: "Hold phase and require explicit scope clarification before Phase 2."
      on_owner_gap: "Assign owner or block; do not use delivery team as implicit owner."
      on_evidence_gap: "Record missing evidence in open_handoff_questions; do not infer."
    owner_signoff_required:
      - "business_owner"
      - "technical_owner"
      - "security_owner"
      - "agentops_owner"
    return_to_method_review:
      evaluated: false
      triggered: false
      trigger_reason: ""
      returned_to: ""
      decision_date: ""
  first_behavior_scope:
    phase_id: 3
    status: "not_started"
    required_evidence:
      - "Readiness minimum safe first behavior."
      - "Workflow roles, decisions, edge cases, and information objects."
      - "Organizational source, access, sensitivity, retention, and permitted/prohibited AI actions."
      - "Approved lifecycle behavior level and launch gates."
    pass_criteria:
      - "First behavior is a single buildable behavior, not a roadmap."
      - "Human review path is named and feasible."
      - "Allowed and prohibited inputs, outputs, actions, sources, users, and systems are explicit."
      - "Stop conditions and escalation path are operational."
      - "Build plan milestones inherit the locked first behavior."
    fail_criteria:
      - "First behavior is broader than approved handoff."
      - "Prohibited behaviors are missing or ambiguous."
      - "Human review path is undefined or infeasible."
      - "Workflow boundary differs from approved Step 17/18 scope."
    failure_handling:
      on_scope_expansion: "Block Phase 3 and require change review or return to method."
      on_missing_human_review: "Hold until reviewer role, SLA, and fallback are approved."
      on_source_gap: "Remove source from first behavior or return to Section 1 source readiness work."
    owner_signoff_required:
      - "business_owner"
      - "product_owner"
      - "technical_owner"
      - "data_owner"
      - "security_owner"
      - "agentops_owner"
    return_to_method_review:
      evaluated: false
      triggered: false
      trigger_reason: ""
      returned_to: ""
      decision_date: ""

acceptance_contract:
  required_artifacts:
    - "agent_necessity_kill_test"
    - "agent_build_plan"
    - "agent_architecture_record"
    - "tool_contract_registry"
    - "eval_harness_spec"
    - "guardrail_control_matrix"
    - "trace_observability_spec"
  phase_1_exit_artifacts:
    - "agent_build_contract.authorization"
    - "agent_build_contract.owners"
    - "agent_build_contract.build_scope"
    - "agent_build_contract.gate_decisions.build_conversion_gate"
  phase_3_exit_artifacts:
    - "agent_build_contract.first_behavior_scope"
    - "agent_build_plan"
  success_criteria: []
  non_functional_requirements:
    availability_target: ""
    latency_target: ""
    security_requirements: []
    privacy_requirements: []
    audit_requirements: []
  launch_blockers:
    - "Required Section 1 evidence is missing or not approved."
    - "Build scope exceeds approved handoff."
    - "Required owner or signoff is missing."
    - "Human review, stop condition, revocation, or return-to-method handling is incomplete."

change_control:
  material_change_definition:
    - "New tool permission, write action, or data class."
    - "New user group, workflow boundary, geography, or system of record."
    - "Model class, routing policy, retrieval corpus, or oversight model change."
    - "Any reduction in human approval or monitoring requirement."
    - "Any change that affects value, risk, readiness, truth, ownership, or lifecycle assumptions from Section 1."
  change_review_required: true
  change_review_object_type: "change_expansion_retirement_review"

contract_signoff:
  prepared_by: ""
  reviewed_by: []
  approved_by: []
  approval_status: "not_submitted"
  approval_date: ""
  required_signoff_roles:
    - "business_owner"
    - "technical_owner"
    - "security_owner"
    - "data_owner"
    - "agentops_owner"
  notes: []
