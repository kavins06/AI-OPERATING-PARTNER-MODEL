truth_production_profiles:
  - truth_profile_id: "truth_critical_dates"
    name: "Critical dates used to trigger renewal review"
    linked_information_object_ids:
      - "info_critical_dates"
      - "info_lease_abstract"
    linked_decision_ids:
      - "decision_renewal_path"
    official_source:
      source_id: "src_lease_abstract"
      description: "Lease administration data or executed lease may be official, but the formal authority has not been confirmed."
      status: "candidate"
    de_facto_source:
      source_id: "src_critical_date_report"
      artifact_or_role: "Critical date report or tracker"
      why_people_trust_it: "Assistant asset managers use it to start renewal preparation."
      status: "candidate"
    truth_production_chain:
      - sequence: 1
        step_type: "report_generation"
        description: "Critical dates are pulled from a report or tracker."
        input_source_ids:
          - "src_lease_abstract"
        output_information_object_id: "info_critical_dates"
        owner_or_knower_role: "role_assistant_asset_manager"
        evidence_refs:
          - "int_aam_001"
      - sequence: 2
        step_type: "reconciliation"
        description: "Assistant asset manager compares critical dates against lease abstract when preparing the renewal list."
        input_source_ids:
          - "src_critical_date_report"
          - "src_lease_abstract"
        output_information_object_id: "info_critical_dates"
        owner_or_knower_role: "role_assistant_asset_manager"
        evidence_refs:
          - "int_aam_001"
    embedded_business_rules:
      - rule_id: "rule_notice_window_review"
        where_encoded: "expert_memory"
        description: "Notice windows and option terms must be checked before renewal strategy is drafted."
        owner_or_knower_role: "role_asset_manager"
        extraction_needed: true
    truth_status: "disputed"
    reproducibility: "low"
    auditability: "low"
    versioning_or_change_control: "unknown"
    owner_role: "unknown"
    steward_or_knower_role: "role_assistant_asset_manager"
    fragility_signals:
      - "conflicting_reports"
      - "no_reconciliation"
      - "unknown"
    ai_safe_usage:
      allowed_uses:
        - "summarize"
        - "compare"
        - "flag_uncertainty"
        - "draft_question"
        - "escalate"
      prohibited_uses:
