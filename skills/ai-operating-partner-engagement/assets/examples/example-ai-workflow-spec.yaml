    sensitivity: "tenant and lease dates"
    likely_owner: "Director Asset Management"
    validation_status: "needs_governance_resolution"
    evidence_refs:
      - "int_aam_001"
    confidence: "medium"

  - source_id: "src_lease_abstract"
    name: "Lease abstract"
    source_type: "document"
    information_object_ids:
      - "info_lease_abstract"
    trusted_for:
      - "Lease terms and renewal options"
    known_quality_issues:
      - "Update owner not confirmed."
