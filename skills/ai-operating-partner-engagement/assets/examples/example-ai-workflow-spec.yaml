spec_version: "0.1"
object_type: "organizational_workflow_intelligence"
status: "initial_workflow_spec"
build_ready: false

workflow:
  workflow_id: "wf_retail_tenant_renewal_review"
  name: "Retail Tenant Renewal Review"
  business_purpose: "Support timely, consistent, source-backed renewal strategy decisions."
  trigger: "Tenant reaches lease expiration review window."
  outcome: "Renewal strategy approved and next action assigned."
  validation_status: "partially_validated"
  confidence: "medium"

organization_context:
  company_type: "Real estate asset management firm"
  business_unit: "Retail asset management"
  org_structure_status: "partially_validated"
  roles:
    - role_id: "role_vp_asset_management"
      name: "VP Asset Management"
      layer: 1
    - role_id: "role_director_asset_management"
      name: "Director Asset Management"
      layer: 2
    - role_id: "role_asset_manager"
      name: "Asset Manager"
      layer: 3
    - role_id: "role_assistant_asset_manager"
      name: "Assistant Asset Manager"
      layer: 4
  reporting_structure:
    - parent_role_id: "role_vp_asset_management"
      child_role_id: "role_director_asset_management"
      relationship_type: "reports_to"
    - parent_role_id: "role_director_asset_management"
      child_role_id: "role_asset_manager"
      relationship_type: "reports_to"
    - parent_role_id: "role_asset_manager"
      child_role_id: "role_assistant_asset_manager"
      relationship_type: "reports_to"

interview_coverage:
  intended_population_by_role:
    - role_id: "role_vp_asset_management"
      count: 1
    - role_id: "role_director_asset_management"
      count: 3
    - role_id: "role_asset_manager"
      count: 6
    - role_id: "role_assistant_asset_manager"
      count: 20
  completed_by_role:
    - role_id: "role_vp_asset_management"
      count: 1
    - role_id: "role_director_asset_management"
      count: 3
    - role_id: "role_asset_manager"
      count: 3
    - role_id: "role_assistant_asset_manager"
      count: 6
  coverage_strategy: "Stratified sample across hierarchy, portfolio variation, and workflow involvement."
  saturation_status: "partial"
  expansion_needed: true
  expansion_reason:
    - "Confirm whether assistant asset manager workflows vary by director group."

role_involvement:
  - role_id: "role_assistant_asset_manager"
    involvement_type: "execution"
    responsibilities_in_workflow:
      - "Collect renewal inputs"
      - "Update trackers"
      - "Prepare renewal materials"
    observed_importance: "high"
  - role_id: "role_asset_manager"
    involvement_type: "decision"
    responsibilities_in_workflow:
      - "Review renewal position"
      - "Recommend renewal path"
    observed_importance: "high"

steps:
  - step_id: "step_001"
    sequence: 1
    primary_role_id: "role_assistant_asset_manager"
    action: "Identifies upcoming tenant renewals from critical date or lease expiration report."
    inputs:
      - "Critical date report"
      - "Lease abstract"
    information_object_ids:
      - "info_critical_dates"
      - "info_lease_abstract"
    systems_or_sources_mentioned:
      - "src_critical_date_report"
      - "src_lease_abstract"
    outputs:
      - "Upcoming renewal list"
    handoff_to_role_id: "role_asset_manager"
    evidence_refs:
      - "int_aam_001"
    validation_status: "interview_claim"
    confidence: "medium"

decisions:
  - decision_id: "decision_renewal_path"
    name: "Determine tenant renewal path"
    owner_role_id: "role_asset_manager"
    inputs_required:
      - "Lease terms"
      - "Tenant sales"
      - "AR status"
      - "Broker feedback"
      - "Property strategy"
    information_object_ids:
      - "info_lease_abstract"
      - "info_tenant_sales"
      - "info_ar_aging"
      - "info_broker_feedback"
    tacit_judgment:
      - "Strategic tenant value may outweigh near-term economics."
    human_required: true
    ai_support_allowed:
      - "Prepare source-backed renewal brief"
      - "Flag missing inputs"
    ai_support_forbidden:
      - "Make final renewal decision"
      - "Send tenant communication"
    validation_status: "partially_validated"
    confidence: "medium"

information_objects:
  - information_object_id: "info_critical_dates"
    name: "Critical dates"
    object_type: "report"
    business_use: "Identify tenants entering the renewal review window."
    used_in_step_ids:
      - "step_001"
    required_for_outcome: true
    required_fields_or_attributes:
      - "tenant"
      - "property"
      - "lease expiration"
      - "renewal notice date"
    lookup_keys:
      - "property"
      - "tenant"
      - "as_of_date"
    source_access_profile_ids:
      - "sap_critical_dates_report"
    compared_against_information_object_ids:
      - "info_lease_abstract"
    known_quality_or_access_issues:
      - "Ownership and correction process not yet confirmed."
    sensitivity: "lease and tenant operating information"
    validation_status: "access_path_captured"
    evidence_refs:
      - "int_aam_001"
    confidence: "medium"

  - information_object_id: "info_ar_aging"
    name: "Tenant AR aging"
    object_type: "report"
    business_use: "Check tenant payment status before renewal recommendation."
    used_in_decision_ids:
      - "decision_renewal_path"
    required_for_outcome: true
    required_fields_or_attributes:
      - "tenant balance"
      - "days past due"
      - "charge type"
    lookup_keys:
      - "property"
      - "tenant"
      - "as_of_date"
    source_access_profile_ids:
      - "sap_ar_aging_property_management"
    compared_against_information_object_ids:
      - "info_lease_abstract"
    known_quality_or_access_issues:
      - "Timing differences may exist after payments or credits."
    sensitivity: "tenant financial information"
    validation_status: "mentioned"
    evidence_refs:
      - "int_am_001"
    confidence: "medium"

  - information_object_id: "info_lease_abstract"
    name: "Lease abstract"
    object_type: "document"
    business_use: "Review renewal options, notice periods, and key lease terms."
    used_in_step_ids:
      - "step_001"
    used_in_decision_ids:
      - "decision_renewal_path"
    required_for_outcome: true
    required_fields_or_attributes:
      - "expiration date"
      - "renewal option"
      - "notice requirement"
      - "base rent"
    lookup_keys:
      - "property"
      - "tenant"
      - "lease id"
    source_access_profile_ids:
      - "sap_lease_abstract"
    known_quality_or_access_issues:
      - "Source of record and update owner not yet confirmed."
    sensitivity: "lease economics and tenant terms"
    validation_status: "mentioned"
    evidence_refs:
      - "int_aam_001"
    confidence: "medium"

  - information_object_id: "info_tenant_sales"
    name: "Tenant sales"
    object_type: "report"
    business_use: "Assess tenant performance and renewal posture."
    used_in_decision_ids:
      - "decision_renewal_path"
    required_for_outcome: false
    required_fields_or_attributes:
      - "sales period"
      - "reported sales"
      - "tenant"
    lookup_keys:
      - "property"
      - "tenant"
      - "period"
    source_access_profile_ids:
      - "sap_tenant_sales"
    known_quality_or_access_issues:
      - "Tenant submissions may be late or incomplete."
    sensitivity: "tenant financial information"
    validation_status: "mentioned"
    evidence_refs:
      - "int_am_001"
    confidence: "medium"

  - information_object_id: "info_broker_feedback"
    name: "Broker feedback"
    object_type: "email"
    business_use: "Add market, tenant, and leasing context to renewal recommendation."
    used_in_decision_ids:
      - "decision_renewal_path"
    required_for_outcome: false
    required_fields_or_attributes:
      - "market feedback"
      - "tenant intent"
      - "leasing alternatives"
    lookup_keys:
      - "tenant"
      - "property"
      - "broker"
    source_access_profile_ids:
      - "sap_broker_email"
    known_quality_or_access_issues:
      - "Unstructured email context may be incomplete or hard to retrieve."
    sensitivity: "relationship and deal context"
    validation_status: "mentioned"
    evidence_refs:
      - "int_am_001"
    confidence: "medium"

systems_mentioned:
  - system_id: "sys_property_management"
    name: "Property management software"
    purpose: "Tenant, lease, receivables, and property operations data."
    likely_owner: "Property management / accounting"
    data_held:
      - "rent roll"
      - "tenant ledger"
      - "AR aging"
      - "work orders"
    source_access_profile_ids:
      - "sap_ar_aging_property_management"
    access_constraints_known: false
    validation_status: "needs_governance_resolution"
    evidence_refs:
      - "int_am_001"
    confidence: "medium"

