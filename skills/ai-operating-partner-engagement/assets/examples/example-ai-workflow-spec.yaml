      - "int_am_001"
    confidence: "medium"

  - source_id: "src_broker_email"
    name: "Broker email"
    source_type: "email"
    information_object_ids:
      - "info_broker_feedback"
    trusted_for:
      - "Market and relationship context"
    known_quality_issues:
      - "Unstructured and incomplete if not copied into workflow materials."
    sensitivity: "relationship and deal context"
    likely_owner: "Asset Manager"
    validation_status: "needs_governance_resolution"
    evidence_refs:
      - "int_am_001"
    confidence: "medium"

