    sensitivity: "tenant financial information"
    likely_owner: "Accounting"
    validation_status: "needs_governance_resolution"
    evidence_refs:
      - "int_am_001"
    confidence: "medium"

  - source_id: "src_tenant_sales_report"
    name: "Tenant sales report"
    source_type: "report"
    information_object_ids:
      - "info_tenant_sales"
