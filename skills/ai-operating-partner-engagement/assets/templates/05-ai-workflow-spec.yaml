    later_step_required:  # allowed: controlled_validation_governance_resolution | knowledge_mapping | analytics_maturity_assessment | kpi_design | architecture_blueprint | risk_register | zero_trust_controls | readiness_assessment
    priority:  # allowed: low | medium | high
completeness_checks:
  - check_id: "decision.owner_present"
    description: "Every material decision has an owner role or explicit unknown routed to validation."
    status:  # allowed: pass | fail | not_applicable
    failing_object_ids: []
    route_if_failed: "controlled_validation_governance_resolution"
  - check_id: "information_object.source_access_profile_present"
    description: "Every material information object has at least one source access profile or an unknown routed to validation."
    status:  # allowed: pass | fail | not_applicable
    failing_object_ids: []
    route_if_failed: "controlled_validation_governance_resolution"
  - check_id: "material_truth.truth_production_profile_present"
    description: "Every material number, status, report, decision input, metric, or artifact treated as true has a truth production profile."
    status:  # allowed: pass | fail | not_applicable
    failing_object_ids: []
    route_if_failed: "controlled_validation_governance_resolution"
  - check_id: "candidate_ai_assist.boundaries_present"
    description: "Every candidate AI assist states allowed behavior, forbidden behavior, human review, and readiness dependencies."
    status:  # allowed: pass | fail | not_applicable
    failing_object_ids: []
    route_if_failed: "organizational_intelligence_diagnostic"
  - check_id: "regulated_domain.extension_linked"
    description: "Every regulated-domain trigger has a linked extension or explicit legal/risk review route."
    status:  # allowed: pass | fail | not_applicable
    failing_object_ids: []
    route_if_failed: "knowledge_mapping"

