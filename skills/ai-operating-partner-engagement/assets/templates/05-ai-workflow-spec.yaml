      description:
      status:  # allowed: confirmed | candidate | disputed | missing | not_applicable | unknown
    de_facto_source:
      source_id:
      artifact_or_role:
      why_people_trust_it:
      status:  # allowed: confirmed | candidate | disputed | unknown
    truth_production_chain:
      - sequence:
        step_type:  # allowed: system_entry | export | report_generation | formula | spreadsheet_macro | manual_adjustment | reconciliation | expert_judgment | approval | final_reporting | other
        description:
        input_source_ids:
          -
        output_information_object_id:
        owner_or_knower_role:
        evidence_refs:
          -
    embedded_business_rules:
      - rule_id:
        where_encoded:  # allowed: system_config | report_logic | formula | spreadsheet_macro | SOP | expert_memory | meeting_habit | unknown
        description:
        owner_or_knower_role:
        extraction_needed: false
    truth_status:  # allowed: authoritative | conditionally_reliable | shadow_derived | manually_adjusted | person_dependent | disputed | missing | not_reproducible | unknown
    reproducibility:  # allowed: high | medium | low | unknown
    auditability:  # allowed: high | medium | low | unknown
    versioning_or_change_control:
    owner_role:
    steward_or_knower_role:
    fragility_signals:
      # allowed: unowned | retired_employee_dependency | shared_drive_file | undocumented_macro | manual_copy_paste | no_version_control | conflicting_reports | no_reconciliation | unknown
    ai_safe_usage:
      allowed_uses:
        - "summarize"
        - "compare"
        - "flag_uncertainty"
        - "draft_question"
        - "escalate"
      prohibited_uses:
        - "final_decision"
        - "autonomous_action"
    validation_status:  # allowed: mentioned | artifact_supported | needs_governance_resolution | validated | blocked
