  client_decision_needed: ""
  approval_boundary: "Implementation may start only after Step 18 is complete and the client approves a separate implementation phase."

audience_views:
  - view_id: "sponsor_view"
    audience: "client_sponsor"
    purpose: "Approve priority, funding appetite, owner commitment, and future implementation path."
    include_sections:
      - decision_summary
      - business_case
      - first_build_scope
      - major_risks
      - required_owner_commitments
      - future_approval_needed
    exclude_sections:
      - credential_details
      - sensitive_field_detail
      - internal_diagnostic_notes
  - view_id: "business_owner_view"
    audience: "business_owner"
    purpose: "Confirm workflow fit, human review, success criteria, and operating ownership."
    include_sections:
      - workflow_scope
      - behavior_contract
      - edge_cases
      - success_metrics
      - operating_owner_responsibilities
    exclude_sections:
      - detailed_security_controls
      - unrelated_system_details
  - view_id: "it_data_security_view"
    audience: "it_data_security"
    purpose: "Confirm future system access, permission scope, data handling, logging, controls, and blocked paths."
    include_sections:
      - systems_and_sources
      - runtime_design_requirements
      - hosting_environment_requirements
      - future_access_requests
      - future_component_contracts
      - normalization_plan
      - risk_and_controls
      - test_and_sandbox_plan
    exclude_sections:
      - broad_employee_validation_views
  - view_id: "risk_legal_compliance_view"
    audience: "risk_legal_compliance"
    purpose: "Confirm named risk owners, regulated-domain constraints, prohibited actions, review rules, and stop conditions."
    include_sections:
      - risk_and_controls
      - regulated_domain_risks
      - sensitive_data_summary
      - truth_production_readiness
      - human_approval_gates
      - stop_conditions
    exclude_sections:
      - unrelated_workflow_variants
  - view_id: "build_team_view"
    audience: "future_build_team"
    purpose: "Build later without rediscovering the organization."
    include_sections:
      - full_packet
    exclude_sections: []
  - view_id: "remediation_owner_view"
    audience: "remediation_owner"
    purpose: "Show only the assigned blocker, evidence needed, completion criteria, and dependency."
    include_sections:
      - assigned_required_fixes
    exclude_sections:
      - unrelated_blockers
      - full_implementation_packet

