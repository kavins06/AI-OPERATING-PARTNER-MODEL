engagement_tiering_id: "tiering_<client>_v1"
spec_version: "0.1"
object_type: "engagement_tiering_and_vertical_extension"
status: "draft" # draft | sponsor_confirmed | revised
uses_tier_matrix_id: "tier_matrix.v3"
uses_offline_proof_catalog_id: "offline_proof_catalog.v3"

client_context:
  client_name: ""
  industry_vertical: "" # real_estate | healthcare | financial_services | legal | other | unknown
  organization_size:
    employees_or_users: null
    geography_count: null
    business_units: []
  operating_model:
    model_type: "" # centralized | federated | franchise | independent_contractor | multi_region | mixed | unknown
    variation_risk: "unknown" # low | medium | high | unknown
  regulated_domain: false
  regulated_domain_extension_ids: []
  vertical_extension_schema_id: "vertical-extension.v3"

engagement_tier:
  selected_tier: "standard" # lite | standard | deep
  tier_rationale: ""
  expected_duration: ""
  expected_interview_depth: ""
  expected_artifact_depth: ""
  sponsor_expectations: []

tier_rules:
  lite:
    intended_for: "Narrow workflow, limited stakeholder group, low-to-medium risk, known systems."
    minimum_required_artifacts:
      - "candidate_use_case_shortlist"
      - "workflow_intelligence_object"
      - "truth_production_profiles"
      - "readiness_object"
      - "implementation_decision_packet"
    not_suitable_when:
      - "Regulated-domain external communication is in scope."
      - "Truth production is materially disputed."
      - "Independent-contractor, franchise, or high-variation operating model controls adoption."
  standard:
    intended_for: "One to three serious opportunities across a function or business unit."
    minimum_required_artifacts:
      - "full_v3_artifact_set_for_selected_opportunities"
  deep:
    intended_for: "Multi-business-unit, regulated, high-risk, or high-variation enterprise work."
    minimum_required_artifacts:
      - "expanded_variation_mapping"
      - "regulated_domain_extension"
      - "portfolio_comparison"
      - "solution_shape"
      - "adoption_design"

scope_controls:
  selected_discovery_zones: []
  max_candidate_use_cases_to_deep_discover: null
  max_opportunities_to_advance_after_portfolio_comparison: null
  depth_exclusions: []
  explicit_non_goals: []

pre_build_boundary:
  no_agent_build_started: true
  no_mcp_or_connector_build_started: true
  no_normalization_pipeline_build_started: true
  no_credentials_or_live_access_requested: true
  offline_proof_points_allowed: true
  offline_proof_point_boundary: "Allowed only with approved redacted, synthetic, or historical examples and no live system connection, no credentials, no production deployment, no write-back, and no unapproved data movement."
  offline_proof_point_catalog_ref: "offline_proof_catalog.v3"
  selected_offline_proof_points:
    - proof_type: ""
      linked_candidate_use_case_id: ""
      step_de_risked: ""
      rationale: ""

approval:
  sponsor_confirmed_tier: false
  confirmed_by: ""
  confirmation_date: ""
  open_questions: []
