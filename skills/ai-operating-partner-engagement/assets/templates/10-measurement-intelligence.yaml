measurement_intelligence_id: "mi.workflow.v1"
workflow_ids: []
version: "0.1"
status: "draft" # draft | owner_validated | partially_validated | blocked

source_inputs:
  workflow_spec_ids: []
  diagnostic_ids: []
  validation_event_ids: []
  guidance_pack_ids: []
  planning_evidence_refs: []

role_split:
  ai_work:
    - "Extract metric needs from workflows, decisions, approvals, edge cases, and candidate AI assists."
    - "Find candidate sources and detect source or formula conflicts."
    - "Draft KPI definitions and analytics maturity scores."
    - "Propose trust status with evidence."
  operating_partner_work:
    - "Decide which metrics matter for value, risk, and implementation planning."
    - "Challenge vague metrics and remove low-value measurement noise."
    - "Route material unresolved issues."
  client_work:
    - "Confirm source authority, formulas, grain, owners, freshness, quality checks, access boundaries, and allowed AI usage."

decision_metric_map:
  - decision_id:
    workflow_id:
    decision_or_action:
    metrics_needed: []
    why_needed:
    wrong_metric_risk:
    linked_guidance_ids: []

metric_definitions:
  - metric_id:
    name:
    business_question:
    decision_or_action_supported:
    formula:
    grain:
    unit:
    source_of_record:
    operational_working_source:
    supporting_sources: []
    source_access_profile_ids: []
    owner_role:
    steward_role:
    refresh_cadence:
    freshness_required_for_decision:
    thresholds_or_targets: []
    quality_checks: []
    allowed_filters: []
    drilldowns: []
    reconciliation_status: "unknown" # reconciled | timing_gap_known | conflicting | not_reconciled | unknown
    known_issues: []
    trust_status: "unknown" # trusted | conditionally_trusted | disputed | untrusted | unknown
    trust_evidence: []
    confidence: "unknown"
    owner_confirmation:
      required: true
      confirmed_by_role:
      status: "not_started" # not_started | confirmed | corrected | disputed | blocked
      notes:

metric_trust_issues:
  - issue_id:
    metric_id:
    issue_type: "source_conflict" # source_conflict | formula_conflict | grain_mismatch | stale_data | missing_owner | quality_gap | access_gap | misuse
    description:
    affected_decisions: []
    severity:
    recommended_resolution:
    route_to_step: "" # step7_governance | step12_architecture_normalization | step14_readiness | do_not_use_yet

reporting_reality:
  current_reports_or_dashboards:
    - report_id:
      name:
      owner_role:
      source_systems: []
      used_by_roles: []
      decisions_supported: []
      trust_notes:
  shadow_trackers:
    - tracker_id:
      name:
      owner_role:
      why_used:
      conflict_with_authoritative_source:
  manual_exports_or_workarounds: []
  stale_or_unused_dashboards: []

analytics_maturity:
  current_level:
  dimension_scores:
    business_question_clarity:
    source_integration:
    data_quality:
    metric_definitions:
    dashboard_usefulness:
    governance_stewardship:
    security_access_control:
    statistical_modeling_discipline:
    feedback_monitoring:
    change_adoption:
  evidence_refs: []
  suitable_future_ai_scope:
  maturity_blockers: []

agent_safe_metric_usage:
  allowed:
    - metric_id:
      allowed_uses: [] # calculate | cite | compare | summarize | flag_uncertainty | draft_question | escalate
      conditions: []
      required_evidence_refs: []
  prohibited:
    - metric_id:
      prohibited_use:
      reason:
      safe_alternative:
  human_review_required_when: []

unresolved_metric_questions:
  - question_id:
    question:
    metric_ids: []
    resolver_role:
    route_to_step:
    blocks_future_ai_use: false

stop_boundary:
  does_not_build_dashboards: true
  does_not_build_pipelines: true
  does_not_build_models: true
  does_not_build_mcp_or_connectors: true
  does_not_create_live_integrations: true
