product_view_contract:
  full_raw_object_shared_with_client: false
  supported_views:
    - view_id: "executive_intelligence_view"
      audience: "sponsor | executive"
      include_object_types: ["summary", "candidate_ai_portfolio", "major_blockers", "truth_risk_summary", "next_routes"]
      exclude_object_types: ["raw_transcripts", "unredacted_sensitive_content", "internal_inference_notes"]
    - view_id: "operating_intelligence_view"
      audience: "business_owner | operator_manager"
      include_object_types: ["workflows", "variants", "handoffs", "edge_cases", "owner_gaps", "knowledge_gaps"]
      exclude_object_types: ["unrelated_sensitive_objects", "organization_wide_raw_model"]
    - view_id: "data_governance_view"
      audience: "it | data | security | system_owner"
      include_object_types: ["systems", "sources", "source_access_profiles", "truth_production_profiles", "sensitive_fields", "retention_gaps"]
      exclude_object_types: ["unrelated_workflow_views", "raw_interview_notes"]
    - view_id: "ai_fit_boundary_view"
      audience: "sponsor | operating_partner | build_strategy"
      include_object_types: ["candidate_ai_portfolio", "safe_now", "unsafe_now", "fix_first", "prohibited", "next_routes"]
      exclude_object_types: ["credentials", "implementation_secrets", "raw_sensitive_values"]

downstream_payloads_for_steps_9_to_18:
