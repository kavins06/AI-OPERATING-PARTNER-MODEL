identity_and_privacy:
  stable_id_policy: "Use stable non-secret IDs for roles, people, workflows, systems, sources, decisions, and evidence."
  people_identity_mode: "role_only | pseudonymized_person_ids | named_people_allowed_by_client"
  sensitive_content_policy: "Store sensitive content classes and handling rules; avoid unnecessary raw sensitive values."
  transcript_policy: "Reference transcripts or summaries; do not require raw transcripts in the product payload."
  evidence_policy: "Reference approved planning evidence and redaction status."

