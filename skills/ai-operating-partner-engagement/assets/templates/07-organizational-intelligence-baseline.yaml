baseline_purpose:
  description: "Structured data substrate for a separate client-facing Organizational Intelligence product."
  not_a_report: true
  not_a_build_plan: true
  no_credentials_or_live_access_included: true
  no_raw_transcript_or_unredacted_sensitive_content_required: true

