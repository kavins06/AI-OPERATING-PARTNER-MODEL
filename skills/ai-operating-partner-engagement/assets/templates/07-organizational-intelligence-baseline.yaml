  step17_decision_packet_seeds: []
  step18_lifecycle_seeds: []

baseline_release_gate:
  ready_to_use_for_client_product_views: false
  minimum_conditions:
    - "Candidate use cases have explicit status and AI-fit boundary."
    - "Material workflows have validation status and evidence references."
    - "Material information objects have source access profiles or unresolved route."
    - "Material numbers, statuses, reports, and decision inputs have truth production profiles or unresolved route."
    - "Material variations are mapped or explicitly not applicable."
    - "Critical unresolved items are named with owner candidate and next route."
    - "Sensitive content is classified or excluded from product views."
  release_notes:
  operating_partner_judgment:
