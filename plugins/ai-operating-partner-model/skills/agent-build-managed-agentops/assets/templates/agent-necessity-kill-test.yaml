agent_fit_tests:
  - test_id: "requires_contextual_judgment"
    question: "Does the approved behavior require contextual judgment across variable cases rather than deterministic branching?"
    pass_condition: "Evidence shows materially different cases require judgment that cannot be captured by a stable rule set."
    fail_condition: "A deterministic rule tree, workflow automation, SOP, or report satisfies the outcome."
    status: "not_started"
    evidence_refs: []
  - test_id: "requires_language_or_unstructured_reasoning"
    question: "Does the work depend on interpreting or drafting unstructured language that fixed templates cannot handle safely?"
    pass_condition: "Source examples show variable language, context interpretation, or synthesis is required."
    fail_condition: "A fixed template, mail merge, or structured form can safely produce the output."
    status: "not_started"
    evidence_refs: []
  - test_id: "agent_value_exceeds_operating_burden"
    question: "Does measurable value justify evals, monitoring, controls, incident response, support, and ongoing AgentOps?"
    pass_condition: "Value case covers incremental benefit and operating cost with named owners and review cadence."
    fail_condition: "Benefit is speculative, smaller than operating burden, or lacks owner accountability."
    status: "not_started"
    evidence_refs: []
  - test_id: "scope_can_be_safely_constrained"
    question: "Can the first behavior be constrained tightly enough to test without production-scale downside?"
    pass_condition: "Allowed users, sources, actions, outputs, environments, and stop conditions are explicit."
    fail_condition: "Safe first behavior depends on broad access, production-only learning, or undefined boundaries."
    status: "not_started"
    evidence_refs: []
  - test_id: "human_oversight_is_workable"
    question: "Can the required human review path operate at expected volume and speed?"
    pass_condition: "Reviewer role, SLA, fallback, expected volume, and escalation path are feasible."
    fail_condition: "Reviewer capacity, authority, or SLA is missing or incompatible with workflow demand."
    status: "not_started"
    evidence_refs: []

