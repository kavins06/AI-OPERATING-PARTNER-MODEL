decision_gate:
  phase_id: 2
  status: "not_started"
  pass_criteria:
    - "No simpler alternative satisfies the approved outcome with lower risk and acceptable value."
    - "At least one agent-fit test tied to contextual judgment or unstructured language passes with evidence."
    - "Agent value exceeds operating burden after controls and human review are included."
    - "Human oversight is feasible for expected volume and escalation."
    - "Required scope reductions keep the first behavior equal to or narrower than approved Step 17/18 scope."
  fail_criteria:
    - "A simpler non-agent path satisfies the approved outcome."
    - "Agent value does not justify operating burden."
    - "Human oversight is not workable."
    - "Agent path requires scope expansion, unapproved access, or changed behavior level."
    - "Required evidence is missing for any critical value, risk, or feasibility claim."
  automatic_kill_conditions:
    - "Selected simpler alternative meets the approved outcome with lower risk."
    - "Agent path requires autonomous action that was not approved."
    - "Agent path requires production data or write/send access not approved in Step 17/18."
    - "No accountable business owner accepts ongoing AgentOps burden."
  conditional_pass_allowed_only_when:
    - "Named evidence gaps do not affect the agent/no-agent decision."
    - "Follow-up is assigned to an owner and due before architecture or tool enablement."
  failure_handling:
    on_simpler_path_selected: "Stop Section 2 agent build and return to method owner to revise the implementation decision."
    on_value_gap: "Hold until business value case is corrected or agent path is rejected."
    on_oversight_gap: "Reduce scope, redesign review flow, or return to method."
    on_scope_expansion: "Trigger change review or return-to-method before further build work."

