rule_group: production_release
phase_id: 12
phase_key: production_release
status: active
minimum_required_checks: 8
required_section1_inputs:
  - "technical_blueprint"
  - "managed_lifecycle_object"
  - "risk_control_model"
required_section2_outputs:
  - "release_version_manifest"
failure_modes:
  - "Release lacks versioned prompts, models, tools, schemas, eval sets, permissions, release notes, or rollback package."
return_to_method_triggers:
  - "Release packaging changes approved runtime, tool, source, or behavior scope."
  - "Release packaging changes risk acceptance, lifecycle obligations, monitoring burden, owner model, or production support assumptions."
checks:
  - check_id: "required_section1_inputs_present"
    severity: "error"
    description: "Required Section 1 source artifacts are referenced, approved, versioned, and cited."
  - check_id: "required_section2_outputs_present"
    severity: "error"
    description: "release_version_manifest is present or intentionally blocked with owner and reason."
  - check_id: "checklist_has_phase_specific_sections"
    severity: "error"
    description: "Checklist includes exact sections ## Phase-Specific Checks and ## Blocking Conditions."
  - check_id: "semantic_version_and_release_type_present"
    severity: "error"
    description: "Release version, release type, target environment, material-change status, and release owner are explicit."
  - check_id: "immutable_artifact_inventory_complete"
    severity: "error"
    description: "Code, prompts, model config, retrieval, tools, permissions, schemas, evals, guardrails, trace, dashboards, runbooks, and comms are immutable and versioned."
  - check_id: "approved_scope_preserved"
    severity: "error"
    description: "Release contains no unapproved permission, source, tool, user group, output type, model config, or behavior level."
  - check_id: "eval_control_trace_results_attached"
    severity: "error"
    description: "Blocking eval, regression, adversarial, guardrail, and trace results are attached for this release candidate."
  - check_id: "compatibility_and_migration_ready"
    severity: "error"
    description: "Schema, tool contract, data contract, model runtime, client environment, and migrations are compatible or explicitly blocked."
  - check_id: "deployment_smoke_tests_ready"
    severity: "error"
    description: "Deployment method, target, release window, rollout strategy, feature flags, config/secrets changes, smoke tests, and post-deploy checks are defined."
  - check_id: "rollback_package_ready"
    severity: "error"
    description: "Previous stable version, rollback package, triggers, owner, authorizers, expected restore time, steps, and validation checks are complete."
  - check_id: "monitoring_handoff_ready"
    severity: "error"
    description: "First 24 hours and first week monitoring owners, dashboards, alerts, cadence, and stop conditions are live."
  - check_id: "release_notes_and_comms_complete"
    severity: "warning"
    description: "Release notes include user-visible changes, operator changes, known risks, support contacts, and rollback contact."
  - check_id: "rubric_has_minimum_criteria"
    severity: "error"
    description: "Rubric has at least 8 criteria, each with criterion_id, required, evidence_required, and pass_condition."
  - check_id: "return_to_method_triggers_present"
    severity: "warning"
    description: "Return-to-method triggers are listed and evaluated."
