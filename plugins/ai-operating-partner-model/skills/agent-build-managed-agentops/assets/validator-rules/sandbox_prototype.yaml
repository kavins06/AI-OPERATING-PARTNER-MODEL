rule_group: sandbox_prototype
phase_id: 8
phase_key: sandbox_prototype
status: active
minimum_required_checks: 8
required_section1_inputs:
  - "technical_blueprint"
  - "ai_guidance_pack"
  - "risk_control_model"
  - "method_to_build_handoff_contract"
required_section2_outputs:
  - "environment_progression_gate"
  - "release_version_manifest"
failure_modes:
  - "Sandbox uses unapproved data or access."
  - "Prototype deviations are not recorded."
  - "Sandbox success is treated as production readiness."
return_to_method_triggers:
  - "Sandbox learning changes approved scope, risk, truth, or value assumptions."
  - "Sandbox feasibility requires different behavior level, source, tool, access, oversight, or lifecycle model."
checks:
  - check_id: "required_section1_inputs_present"
    severity: "error"
    description: "Required Section 1 source artifacts are referenced, approved, versioned, and cited."
  - check_id: "required_section2_outputs_present"
    severity: "error"
    description: "environment_progression_gate and release_version_manifest are present or intentionally blocked."
  - check_id: "checklist_has_phase_specific_sections"
    severity: "error"
    description: "Checklist includes exact sections ## Phase-Specific Checks and ## Blocking Conditions."
  - check_id: "sandbox_isolation_verified"
    severity: "error"
    description: "Sandbox uses approved isolated environment, approved test data, approved secrets, and no unapproved production access."
  - check_id: "release_candidate_versioned"
    severity: "error"
    description: "Sandbox build versions code, prompts, model config, retrieval, tools, schemas, eval sets, controls, and rollback package."
  - check_id: "eval_control_trace_results_present"
    severity: "error"
    description: "Eval, adversarial, guardrail, permission-boundary, and trace completeness results are attached."
  - check_id: "tool_permission_paths_tested"
    severity: "error"
    description: "Allowed tool paths and denied unregistered/write/send/export/unauthorized paths are tested."
  - check_id: "deviation_and_defect_logs_present"
    severity: "error"
    description: "Every sandbox deviation and defect has severity, owner, remediation, retest plan, pilot impact, and return-to-method assessment."
  - check_id: "rollback_revocation_tested"
    severity: "error"
    description: "Feature pause, tool/credential revocation, and rollback to previous sandbox build are tested."
  - check_id: "sandbox_success_not_production_readiness"
    severity: "error"
    description: "Sandbox outcome is framed as evidence for pilot readiness, not production readiness."
  - check_id: "pilot_dependencies_identified"
    severity: "warning"
    description: "Pilot roster, support, monitoring, feedback, stop conditions, and open risks are explicit."
  - check_id: "rubric_has_minimum_criteria"
    severity: "error"
    description: "Rubric has at least 8 criteria, each with criterion_id, required, evidence_required, and pass_condition."
  - check_id: "return_to_method_triggers_present"
    severity: "warning"
    description: "Return-to-method triggers are listed and evaluated."
