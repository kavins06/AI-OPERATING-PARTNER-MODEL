        - "No prompt context retention beyond trace policy."
      audit_events_emitted:
        - "model_invocation_completed"
    - component_id: "tool_orchestration"
      component_type: "tool_orchestration"
      owner: "Agent engineer"
      purpose: "Call only registered read-only lookup tools."
      environments:
        - "sandbox"
        - "limited_pilot"
      dependencies:
        - "crm_read_only_lookup"
        - "intake_form_read_only_lookup"
      approved_tool_contracts:
        - "crm_read_only_lookup"
        - "intake_form_read_only_lookup"
      denied_tool_categories:
