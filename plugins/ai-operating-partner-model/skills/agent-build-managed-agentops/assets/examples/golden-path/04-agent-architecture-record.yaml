        - "crm_write"
      audit_events_emitted:
        - "tool_call_requested"
        - "tool_call_completed"
    - component_id: "human_review_queue"
      component_type: "human_review"
      owner: "Revenue Operations Manager"
      purpose: "Route draft to coordinator for approval before use."
      environments:
        - "limited_pilot"
      dependencies:
        - "coordinator_workbench"
      approval_sla: "One business day during pilot."
      escalation_path: "Revenue Operations Support"
      audit_events_emitted:
        - "human_approval_requested"
        - "human_approval_decided"
    - component_id: "trace_and_audit_layer"
      component_type: "observability"
      owner: "AgentOps Lead"
      purpose: "Capture run, model, tool, approval, and control evidence."
      environments:
        - "sandbox"
        - "limited_pilot"
      dependencies:
        - "agentops_trace_store"
      trace_retention: "180 days"
      sensitive_data_redaction: "Redact email addresses in searchable logs; retain hashed reference."
