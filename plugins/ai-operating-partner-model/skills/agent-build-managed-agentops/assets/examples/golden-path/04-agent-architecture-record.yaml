        audit_event: "control_violation_detected"
        owner: "Revenue Operations Manager"
      - failure_mode_id: "tool_permission_denied"
        description: "Read-only lookup lacks access to pilot record."
        detection_signal: "Permission error from tool adapter."
        safe_response: "stop_and_escalate"
        user_message_policy: "No draft produced."
        human_escalation_path: "AgentOps Lead"
        audit_event: "tool_call_completed"
        owner: "Security Lead"
