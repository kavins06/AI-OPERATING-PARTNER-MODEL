    agent_name: "Revenue Intake Follow-up Agent"
    agent_purpose: "Draft missing-information follow-up requests for human approval."
    behavior_level: "draft_and_flag"
    oversight_model: "Coordinator approves every draft before use."
    topology: "single_agent"
    orchestration_pattern: "single_turn_with_two_read_only_lookups"
